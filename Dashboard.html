<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Crop Advisory</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: Arial, Helvetica, sans-serif;
}

body{
    background:#c8d8ce;
}

header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:20px 40px;
}

.logo{
    font-weight:bold;
    font-size:20px;
    color:#2e5f3e;
}

select{
    padding:6px 10px;
    border-radius:6px;
    border:1px solid #ccc;
}

.hero{
    padding:40px;
}

.hero h1{
    font-size:40px;
    color:#2d3e33;
    margin-bottom:10px;
}

.hero p{
    color:#3d5147;
    margin-bottom:30px;
}

.btn-container{
    display:flex;
    gap:20px;
    margin-bottom:50px;
}

.primary-btn{
    flex:1;
    padding:15px;
    background:#34c16e;
    border:none;
    border-radius:12px;
    color:white;
    font-weight:bold;
    font-size:16px;
    cursor:pointer;
    transition:0.3s;
}

.primary-btn:hover{
    background:#2da55e;
}

.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:30px;
    max-width:1000px;
    margin:auto;
}

.card{
    background:#e6e6e6;
    padding:40px 20px;
    border-radius:16px;
    text-align:center;
    cursor:pointer;
    transition:0.3s;
    box-shadow:0 4px 8px rgba(0,0,0,0.1);
}

.card:hover{
    transform:translateY(-5px);
    background:#f2f2f2;
}

.card span{
    font-size:40px;
    display:block;
    margin-bottom:15px;
}

.result-box{
    margin:40px auto;
    max-width:800px;
    background:white;
    padding:20px;
    border-radius:12px;
    display:none;
}

.result-box h3{
    margin-bottom:10px;
    color:#2e5f3e;
}

@media(max-width:600px){
    .btn-container{
        flex-direction:column;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">🌾 Smart Crop Advisory</div>
    <select id="language">
        <option>English</option>
        <option>Hindi</option>
        <option>Marathi</option>
    </select>
</header>

<div class="hero">
    <h1>Smart Advisory <br> For Farmers</h1>
    <p>Get accurate crop, fertilizer, and irrigation recommendations.</p>

    <div class="btn-container">
        <button class="primary-btn" onclick="startAdvisory()">Start Advisory</button>
        <button class="primary-btn" onclick="checkMarket()">Check Market Prices</button>
    </div>

    <div class="cards">
        <div class="card" onclick="showResult('soil')">
            <span>🧪</span>
            Soil Test
        </div>
        <div class="card" onclick="goToWeather()">
        <span>☁️</span>
            Weather
        </div>

        <div class="card" onclick="showResult('crop')">
            <span>🌼</span>
            Crop Suggestion
        </div>
        <div class="card" onclick="showResult('fertilizer')">
            <span>🌱</span>
            Fertilizer Plan
        </div>
        <div class="card" onclick="showResult('pest')">
            <span>🐛</span>
            Pest Alerts
        </div>
        <div class="card" onclick="showResult('market')">
            <span>📊</span>
            Market Rates
        </div>
    </div>

    <div class="result-box" id="resultBox">
        <h3 id="resultTitle"></h3>
        <p id="resultText"></p>
    </div>

</div>

<script>
function startAdvisory(){
    alert("Advisory system started! Please select a service below.");
}

function checkMarket(){
    showResult("market");
}

function goToWeather(){
    window.location.href = "weather.html";
}

function showResult(type){
    const box = document.getElementById("resultBox");
    const title = document.getElementById("resultTitle");
    const text = document.getElementById("resultText");

    box.style.display = "block";

    if(type === "soil"){
        title.innerText = "Soil Test Result";
        text.innerText = "Soil pH: 6.5 (Optimal). Nitrogen: Medium. Phosphorus: High. Recommended crop: Wheat or Maize.";
    }
    else if(type === "weather"){
        title.innerText = "Weather Update";
        text.innerText = "Temperature: 28°C. Humidity: 65%. No rainfall expected today. Ideal for irrigation.";
    }
    else if(type === "crop"){
        title.innerText = "Crop Suggestion";
        text.innerText = "Based on your soil and weather conditions, Rice and Soybean are recommended.";
    }
    else if(type === "fertilizer"){
        title.innerText = "Fertilizer Plan";
        text.innerText = "Apply Urea: 50kg/acre. DAP: 25kg/acre. Apply during early growth stage.";
    }
    else if(type === "pest"){
        title.innerText = "Pest Alert";
        text.innerText = "Warning: Mild infestation of leaf caterpillar detected nearby. Recommended pesticide: Neem oil spray.";
    }
    else if(type === "market"){
        title.innerText = "Market Rates";
        text.innerText = "Wheat: ₹2200/quintal. Rice: ₹3100/quintal. Soybean: ₹4500/quintal.";
    }
}

document.getElementById("language").addEventListener("change", function(){
    alert("Language changed to " + this.value);
});
</script>

</body>
</html>
