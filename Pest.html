<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Pest Alerts</title>

<style>
body{
    font-family:Arial, Helvetica, sans-serif;
    background:#dfe9d7;
    margin:0;
    padding:0;
}

.header{
    text-align:center;
    padding:20px;
    background:#c8d4c2;
}

.header h1{
    color:#2e5f3e;
    margin:0;
}

.filter-section{
    text-align:center;
    margin:20px 0;
}

select{
    padding:8px 12px;
    border-radius:6px;
}

.container{
    width:90%;
    max-width:1100px;
    margin:auto;
}

.pest-card{
    background:#f5f5f5;
    padding:20px;
    margin-bottom:20px;
    border-left:6px solid #2e7d32;
    border-radius:8px;
    box-shadow:0 3px 8px rgba(0,0,0,0.1);
}

.pest-title{
    font-size:20px;
    font-weight:bold;
    color:#2e7d32;
    margin-bottom:10px;
}

.label{
    font-weight:bold;
}
</style>

</head>
<body>

<div class="header">
    <h1>🐛 Pest Alerts</h1>
</div>

<div class="filter-section">
    <label>Select Crop: </label>
    <select id="cropFilter">
        <option value="All">All Crops</option>
    </select>
</div>

<div class="container" id="pestContainer"></div>

<script>

let pestData = [];

// Fetch JSON
fetch("pestData.json")
.then(response => response.json())
.then(data => {
    pestData = data.major_crop_pest_dataset;   // 🔥 THIS IS THE FIX
    populateDropdown();
    renderPests("All");
})
.catch(error => {
    console.error("Error loading JSON:", error);
});


// Populate dropdown with unique crops
function populateDropdown(){
    const dropdown = document.getElementById("cropFilter");

    const uniqueCrops = [...new Set(pestData.map(item => item.Crop))];

    uniqueCrops.forEach(crop => {
        const option = document.createElement("option");
        option.value = crop;
        option.textContent = crop;
        dropdown.appendChild(option);
    });

    dropdown.addEventListener("change", function(){
        renderPests(this.value);
    });
}

// Render pest cards
function renderPests(selectedCrop){
    const container = document.getElementById("pestContainer");
    container.innerHTML = "";

    let filteredData;

    if(selectedCrop === "All"){
        filteredData = pestData;
    } else {
        filteredData = pestData.filter(item => item.Crop === selectedCrop);
    }

    filteredData.forEach(item => {
        const card = document.createElement("div");
        card.className = "pest-card";

        card.innerHTML = `
            <div class="pest-title">${item["Pest Name"]}</div>
            <p><span class="label">Affects:</span> ${item.Crop}</p>
            <p><span class="label">Symptoms:</span> ${item.Symptoms}</p>
            <p><span class="label">Solution:</span> ${item.Solution}</p>
            <p><span class="label">Prevention:</span> ${item.Prevention}</p>
        `;

        container.appendChild(card);
    });
}

</script>

</body>
</html>
