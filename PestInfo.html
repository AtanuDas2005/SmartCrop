<!DOCTYPE html>
<html>

<head>
<title>Plant Disease Detection</title>

<style>

body{
font-family:Arial;
background:#0f2027;
color:white;
text-align:center;
padding-top:80px;
}

button{
padding:12px 25px;
background:#00c6ff;
border:none;
color:white;
cursor:pointer;
margin-top:10px;
font-size:16px;
}

button:hover{
background:#0098c6;
}

#preview{
margin-top:20px;
border-radius:6px;
}

#result{
margin-top:25px;
white-space:pre-line;
font-size:18px;
max-width:600px;
margin-left:auto;
margin-right:auto;
}

</style>

</head>

<body>

<h2>Plant Disease Detection</h2>

<input type="file" id="imageInput" accept="image/*">

<br><br>

<img id="preview" width="250">

<br>

<button onclick="detectDisease()">Detect Disease</button>

<div id="result"></div>

<script>

const input = document.getElementById("imageInput");
const preview = document.getElementById("preview");

let base64Image = "";

/* preview image */
input.addEventListener("change", function(){

const file = this.files[0];

if(!file){
alert("Please upload an image");
return;
}

preview.src = URL.createObjectURL(file);

const reader = new FileReader();

reader.onload = function(){
base64Image = reader.result.split(",")[1];
}

reader.readAsDataURL(file);

});


async function detectDisease(){

const resultDiv = document.getElementById("result");

if(base64Image === ""){
resultDiv.innerHTML = "⚠️ Please upload an image first.";
return;
}

resultDiv.innerHTML = "🔍 Analyzing plant leaf...";

try{

const response = await fetch(
"https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash-latest:generateContent?key=AIzaSyDdtDJUaN8YUiNF07rk5P-fIpDePYrxxho",
{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({

contents:[
{
parts:[
{
text:"You are a plant disease expert. Identify the plant disease from the leaf image and provide Disease Name, Causes, Treatment and Prevention."
},
{
inlineData:{
mimeType:"image/jpeg",
data:base64Image
}
}
]
}
]

})
});

const data = await response.json();

console.log(data);

if(data.candidates && data.candidates.length > 0){

const text = data.candidates[0].content.parts[0].text;

resultDiv.innerText = text;

}else{

resultDiv.innerText = "❌ Could not detect disease.\n" + JSON.stringify(data);

}

}catch(error){

console.error(error);

resultDiv.innerText = "⚠️ Error connecting to Gemini API";

}

}

</script>

</body>

</html>
