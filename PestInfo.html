<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SmartCrop - Pest Advisory</title>

<style>
  body {
    font-family: 'Segoe UI', sans-serif;
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
  }

  .container {
    background: rgba(20, 20, 20, 0.9);
    backdrop-filter: blur(20px);
    padding: 30px;
    border-radius: 20px;
    width: 550px;
    color: #e0e0e0;
    box-shadow: 0 10px 40px rgba(0,0,0,0.6);
  }

  h2 {
    text-align: center;
    margin-bottom: 25px;
    color: #00e676;
  }

  select, button {
    width: 100%;
    padding: 14px;
    margin: 12px 0;
    border-radius: 10px;
    border: none;
    font-size: 15px;
  }

  select {
    background: #1e1e1e;
    color: #ffffff;
    border: 1px solid #444;
  }

  button {
    background: #00c853;
    color: white;
    font-weight: bold;
    cursor: pointer;
  }

  button:hover {
    background: #00e676;
  }

  #result {
    margin-top: 20px;
  }

  .card {
    background: #1c1c1c;
    padding: 15px;
    border-radius: 12px;
    border: 1px solid #333;
  }

  .card h3 {
    color: #00e676;
    margin-bottom: 10px;
  }

  .label {
    color: #00e676;
    font-weight: bold;
  }

</style>
</head>

<body>

<div class="container">

  <h2>🌿 SmartCrop Pest Advisor</h2>

  <select id="crop">
    <option value="">Select Crop</option>
    <option value="rice">Rice</option>
    <option value="wheat">Wheat</option>
    <option value="tomato">Tomato</option>
    <option value="potato">Potato</option>
    <option value="cotton">Cotton</option>
    <option value="maize">Maize</option>
  </select>

  <select id="symptom">
    <option value="">Select Symptom</option>
    <option value="leaf holes">Leaf Holes</option>
    <option value="yellowing">Yellowing Leaves</option>
    <option value="wilting">Wilting</option>
    <option value="spots">Leaf Spots</option>
    <option value="curling">Leaf Curling</option>
    <option value="stunted growth">Stunted Growth</option>
  </select>

  <button onclick="getPestInfo()">Get Solution</button>

  <div id="result"></div>

</div>

<script>

const pestData = {

  rice: {
    "leaf holes": {
      name: "Stem Borer",
      cause: "Larvae bore into stems",
      symptoms: "Holes in leaves, dead heart",
      chemical: "Chlorantraniliprole",
      organic: "Neem oil spray",
      prevention: "Maintain water level, remove infected plants"
    },
    "yellowing": {
      name: "Brown Planthopper",
      cause: "Sap-sucking insect",
      symptoms: "Yellowing and drying patches",
      chemical: "Imidacloprid",
      organic: "Soap spray",
      prevention: "Avoid excess nitrogen fertilizer"
    }
  },

  wheat: {
    "yellowing": {
      name: "Aphids",
      cause: "Sap-sucking pests",
      symptoms: "Yellow leaves, sticky residue",
      chemical: "Thiamethoxam",
      organic: "Garlic spray",
      prevention: "Encourage natural predators"
    }
  },

  tomato: {
    "spots": {
      name: "Early Blight",
      cause: "Fungal infection",
      symptoms: "Dark spots with rings",
      chemical: "Mancozeb",
      organic: "Baking soda spray",
      prevention: "Avoid wet leaves, proper spacing"
    },
    "curling": {
      name: "Whiteflies",
      cause: "Sap sucking insects",
      symptoms: "Leaf curl, yellowing",
      chemical: "Acetamiprid",
      organic: "Neem oil",
      prevention: "Use sticky traps"
    }
  },

  potato: {
    "wilting": {
      name: "Bacterial Wilt",
      cause: "Soil-borne bacteria",
      symptoms: "Sudden wilting",
      chemical: "No effective cure",
      organic: "Crop rotation",
      prevention: "Use disease-free seeds"
    }
  },

  cotton: {
    "leaf holes": {
      name: "Bollworm",
      cause: "Larvae feeding",
      symptoms: "Holes in leaves and bolls",
      chemical: "Emamectin benzoate",
      organic: "Neem extract",
      prevention: "Use pheromone traps"
    }
  },

  maize: {
    "stunted growth": {
      name: "Fall Armyworm",
      cause: "Larval feeding",
      symptoms: "Stunted plants, leaf damage",
      chemical: "Spinosad",
      organic: "Neem oil",
      prevention: "Regular scouting"
    }
  }

};

function getPestInfo() {
  const crop = document.getElementById("crop").value;
  const symptom = document.getElementById("symptom").value;
  const resultDiv = document.getElementById("result");

  if (!crop || !symptom) {
    resultDiv.innerHTML = "<div class='card'>⚠️ Please select both crop and symptom.</div>";
    return;
  }

  const pest = pestData[crop]?.[symptom];

  if (pest) {
    resultDiv.innerHTML = `
      <div class="card">
        <h3>🐛 ${pest.name}</h3>
        <p><span class="label">Cause:</span> ${pest.cause}</p>
        <p><span class="label">Symptoms:</span> ${pest.symptoms}</p>
        <p><span class="label">Chemical Treatment:</span> ${pest.chemical}</p>
        <p><span class="label">Organic Treatment:</span> ${pest.organic}</p>
        <p><span class="label">Prevention:</span> ${pest.prevention}</p>
      </div>
    `;
  } else {
    resultDiv.innerHTML = "<div class='card'>❌ No matching pest found.</div>";
  }
}

</script>

</body>
</html>
