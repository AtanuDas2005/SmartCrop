<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Weather Advisory</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: 'Segoe UI', sans-serif;
}

body{
    min-height:100vh;
    background: linear-gradient(135deg,#1b5e20,#4caf50);
    color:white;
}

/* NAVBAR */
.navbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:20px 40px;
}

.logo{
    font-size:22px;
    font-weight:bold;
}

.location-btn{
    padding:8px 16px;
    border:none;
    border-radius:6px;
    background:white;
    color:#1b5e20;
    font-weight:bold;
    cursor:pointer;
    transition:0.3s;
}

.location-btn:hover{
    background:#e8f5e9;
}

/* HERO */
.hero{
    padding:40px;
}

.temperature{
    font-size:90px;
    font-weight:300;
}

.city-name{
    font-size:22px;
    opacity:0.9;
}

/* GRID */
.weather-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:30px;
    padding:40px;
}

.card{
    background: rgba(255,255,255,0.1);
    padding:30px;
    border-radius:15px;
    backdrop-filter: blur(10px);
    transition:0.3s;
}

.card:hover{
    background: rgba(255,255,255,0.2);
    transform:translateY(-5px);
}

.card h3{
    margin-bottom:10px;
}

.card .value{
    font-size:30px;
    font-weight:bold;
}

/* Suggestions */
.suggestions{
    padding:40px;
}

.suggestions h2{
    margin-bottom:20px;
}

ul{
    padding-left:20px;
}

.status{
    padding:0 40px;
    opacity:0.8;
    font-size:14px;
}

@media(max-width:600px){
    .temperature{
        font-size:60px;
    }
}
/* Background Image Layer */
.bg-image{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:url("images/summer.png") center/cover no-repeat;
    filter:blur(15px);
    transform:scale(1.1);
    z-index:-2;
    transition:background 0.8s ease;
}

/* Dark overlay for readability */
body::before{
    content:"";
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.35);
    z-index:-1;
}

/* Remove gradient background */
body{
    background:none;
}

</style>
</head>

<body>

<div class="navbar">
    <div class="logo">🌾 Smart Crop Advisory</div>
    <button class="location-btn" onclick="getLocationWeather()">📍 Use Current Location</button>
</div>

<div id="bgImage" class="bg-image"></div>

<div class="hero">
    <div class="temperature" id="temp">--°</div>
    <div class="city-name" id="city">Click button to detect location</div>
</div>

<div class="weather-grid">
    <div class="card">
        <h3>💧 Humidity</h3>
        <div class="value" id="humidity">-- %</div>
    </div>

    <div class="card">
        <h3>🌧 Rainfall</h3>
        <div class="value" id="rain">-- mm</div>
    </div>
</div>

<div class="suggestions">
    <h2>🌱 Recommended Crops</h2>
    <ul id="cropList"></ul>
</div>

<div class="status" id="status"></div>

<script>

const API_KEY = "149e50f478f10841ac05ac157724e8d7";

window.onload = () => {
    getLocationWeather();
};

function getLocationWeather(){
    const status = document.getElementById("status");

    if(!navigator.geolocation){
        status.innerText = "Geolocation not supported.";
        return;
    }

    status.innerText = "Detecting your location...";

    navigator.geolocation.getCurrentPosition(
        (position) => {
            fetchWeather(position.coords.latitude, position.coords.longitude);
        },
        (error) => {
            status.innerText = "Location permission denied.";
        }
    );
}

async function fetchWeather(lat, lon){
    const status = document.getElementById("status");

    try{
        status.innerText = "Fetching weather data...";

        const response = await fetch(
            `https://api.openweathermap.org/data/2.5/weather?lat=${lat}&lon=${lon}&appid=${API_KEY}&units=metric`
        );

        if(!response.ok){
            throw new Error("Network response not OK");
        }

        const data = await response.json();

        console.log("API RESPONSE:", data);

        if(data.cod !== 200){
            status.innerText = "API Error: " + data.message;
            return;
        }

        const temperature = data.main?.temp ?? "--";
        const humidity = data.main?.humidity ?? "--";
        const rainfall = data.rain?.["1h"] ?? 0;

        document.getElementById("temp").innerText = Math.round(temperature) + "°C";
        document.getElementById("city").innerText = data.name;
        document.getElementById("humidity").innerText = humidity + " %";
        document.getElementById("rain").innerText = rainfall + " mm";

        generateSuggestions(temperature, humidity, rainfall);
        updateBackground(temperature, rainfall);

        function updateBackground(temp, rain){
    const bg = document.getElementById("bgImage");

    if(rain > 3){
        bg.style.background = 'url("images/rain.jpg") center/cover no-repeat';
    }
    else if(temp < 18){
        bg.style.background = 'url("images/winter.jpg") center/cover no-repeat';
    }
    else{
        bg.style.background = 'url("images/summer.jpg") center/cover no-repeat';
    }
}

        status.innerText = "Weather updated successfully.";

    }catch(error){
        console.error("FETCH ERROR:", error);
        status.innerText = "Error fetching weather. Check console.";
    }
}

function generateSuggestions(temp, humidity, rain){
    const cropList = document.getElementById("cropList");
    cropList.innerHTML = "";

    let crops = [];

    if(temp >= 32 && rain < 5){
        crops = ["Millets (Bajra, Ragi)", "Groundnut", "Cotton", "Maize"];
    }
    else if(temp >= 22 && temp < 32 && rain >= 5){
        crops = ["Rice", "Sugarcane", "Soybean"];
    }
    else if(temp < 20){
        crops = ["Wheat", "Barley", "Mustard"];
    }
    else{
        crops = ["Vegetables", "Pulses"];
    }

    crops.forEach(crop => {
        const li = document.createElement("li");
        li.innerText = crop;
        cropList.appendChild(li);
    });
}

</script>


</body>
</html>
