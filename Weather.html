<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Smart Weather Dashboard</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Segoe UI",Arial,sans-serif;
}

body{
    min-height:100vh;

    background:
        radial-gradient(
            circle at 20% 20%,
            rgba(66,165,245,.25),
            transparent 30%
        ),

        radial-gradient(
            circle at 80% 80%,
            rgba(255,152,0,.18),
            transparent 30%
        ),

        linear-gradient(
            135deg,
            #07141b,
            #102b36,
            #163f4d
        );

    color:white;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:25px;
}


/* =========================
   MAIN CONTAINER
========================= */

.container{

    width:min(1200px,100%);

    min-height:680px;

    background:
        rgba(255,255,255,.075);

    border:
        1px solid rgba(255,255,255,.12);

    backdrop-filter:blur(25px);

    border-radius:30px;

    box-shadow:
        0 30px 80px rgba(0,0,0,.45),
        inset 0 1px 0 rgba(255,255,255,.08);

    padding:32px;

    display:grid;

    grid-template-columns:
        1fr 330px;

    gap:28px;
}


/* =========================
   LEFT
========================= */

.left{
    min-width:0;
}


/* =========================
   HEADER
========================= */

.header{

    display:flex;

    align-items:center;

    justify-content:space-between;

    margin-bottom:28px;
}


.brand{

    display:flex;

    align-items:center;

    gap:12px;
}


.brandIcon{

    width:42px;
    height:42px;

    border-radius:13px;

    display:flex;

    align-items:center;
    justify-content:center;

    background:
        linear-gradient(
            135deg,
            #ff9800,
            #ffb74d
        );

    box-shadow:
        0 8px 25px
        rgba(255,152,0,.25);
}


.brandIcon i{
    font-size:20px;
}


.brand h2{

    font-size:19px;

    font-weight:600;
}


.location{

    display:flex;

    align-items:center;

    gap:7px;

    color:
        rgba(255,255,255,.65);

    font-size:13px;
}


.location i{
    color:#ffb74d;
}


/* =========================
   CURRENT WEATHER
========================= */

.current{

    padding:
        10px 5px 20px;
}


.weatherMain{

    display:flex;

    align-items:center;

    justify-content:space-between;
}


.weatherText{
    flex:1;
}


.temperature{

    font-size:92px;

    line-height:1;

    font-weight:300;

    letter-spacing:-5px;
}


.temperature span{

    font-size:35px;

    vertical-align:top;

    position:relative;

    top:12px;

    margin-left:5px;

    color:
        rgba(255,255,255,.7);
}


.description{

    font-size:22px;

    font-weight:500;

    margin-top:15px;

    text-transform:capitalize;
}


.feels{

    margin-top:7px;

    color:
        rgba(255,255,255,.55);

    font-size:14px;
}


/* =========================
   WEATHER ICON
========================= */

.bigIcon{

    width:180px;
    height:180px;

    border-radius:50%;

    display:flex;

    align-items:center;
    justify-content:center;

    background:

        radial-gradient(
            circle,
            rgba(255,193,7,.18),
            rgba(255,193,7,.03) 60%,
            transparent 70%
        );
}


.bigIcon i{

    font-size:105px;

    color:#ffd54f;

    filter:
        drop-shadow(
            0 10px 25px
            rgba(255,193,7,.25)
        );
}


/* =========================
   STATS
========================= */

.stats{

    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:15px;

    margin-top:25px;
}


.stat{

    background:
        rgba(255,255,255,.07);

    border:
        1px solid
        rgba(255,255,255,.08);

    border-radius:18px;

    padding:17px;

    display:flex;

    align-items:center;

    gap:13px;

    transition:.25s;
}


.stat:hover{

    background:
        rgba(255,255,255,.11);

    transform:
        translateY(-2px);
}


.statIcon{

    width:40px;
    height:40px;

    border-radius:12px;

    display:flex;

    align-items:center;
    justify-content:center;

    background:
        rgba(255,152,0,.13);

    color:#ffb74d;
}


.statInfo{

    display:flex;

    flex-direction:column;

    gap:3px;
}


.statLabel{

    font-size:11px;

    color:
        rgba(255,255,255,.5);
}


.statValue{

    font-size:15px;

    font-weight:500;
}


/* =========================
   LOCATION BUTTON
========================= */

.locationButton{

    margin-top:18px;

    display:flex;

    justify-content:center;
}


button{

    border:none;

    outline:none;

    padding:
        12px 20px;

    border-radius:12px;

    background:
        linear-gradient(
            135deg,
            #ff9800,
            #ffb74d
        );

    color:white;

    font-size:14px;

    font-weight:500;

    cursor:pointer;

    box-shadow:
        0 8px 20px
        rgba(255,152,0,.2);

    transition:.25s;
}


button:hover{

    transform:
        translateY(-2px);

    box-shadow:
        0 12px 25px
        rgba(255,152,0,.3);
}


button i{
    margin-right:7px;
}


/* =========================
   CHART
========================= */

.chartBox{

    margin-top:25px;

    background:
        rgba(255,255,255,.055);

    border:
        1px solid
        rgba(255,255,255,.07);

    border-radius:20px;

    padding:
        20px 20px 10px;
}


.chartHeader{

    display:flex;

    align-items:center;

    justify-content:space-between;

    margin-bottom:10px;
}


.chartHeader h3{

    font-size:15px;

    font-weight:500;
}


.chartHeader span{

    font-size:11px;

    color:
        rgba(255,255,255,.45);
}


.chart{
    height:190px;
}


/* =========================
   RIGHT PANEL
========================= */

.right{

    background:
        rgba(0,0,0,.15);

    border:
        1px solid
        rgba(255,255,255,.08);

    border-radius:23px;

    padding:23px;

    display:flex;

    flex-direction:column;
}


/* =========================
   FORECAST HEADER
========================= */

.forecastHeader{

    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-bottom:18px;
}


.forecastHeader h3{

    font-size:18px;

    font-weight:500;
}


.forecastHeader span{

    font-size:11px;

    color:
        rgba(255,255,255,.45);
}


/* =========================
   FORECAST
========================= */

#forecast{

    display:flex;

    flex-direction:column;

    gap:10px;
}


.day{

    padding:15px;

    border-radius:16px;

    background:
        rgba(255,255,255,.055);

    border:
        1px solid transparent;

    transition:.25s;
}


.day:hover{

    background:
        rgba(255,255,255,.1);

    border-color:
        rgba(255,255,255,.08);

    transform:
        translateX(2px);
}


.dayTop{

    display:flex;

    align-items:center;

    justify-content:space-between;
}


.dayName{

    font-size:14px;

    font-weight:500;
}


.dayWeather{

    display:flex;

    align-items:center;

    gap:8px;
}


.dayWeather i{
    color:#ffd54f;
}


.dayTemp{

    font-size:15px;

    font-weight:500;
}


.rainProb{

    margin-top:9px;

    display:flex;

    align-items:center;

    gap:6px;

    font-size:11px;

    color:#90caf9;
}


/* =========================
   LOADING
========================= */

.loading{

    display:flex;

    align-items:center;

    justify-content:center;

    height:100%;

    color:
        rgba(255,255,255,.5);

    font-size:13px;
}


.spinner{

    width:15px;
    height:15px;

    border:
        2px solid
        rgba(255,255,255,.2);

    border-top-color:#ff9800;

    border-radius:50%;

    animation:
        spin .8s linear infinite;

    margin-right:8px;
}


@keyframes spin{

    to{
        transform:
            rotate(360deg);
    }

}


/* =========================
   RESPONSIVE
========================= */

@media(max-width:900px){

    body{
        padding:15px;
    }

    .container{

        grid-template-columns:1fr;

        padding:22px;
    }

    .right{
        width:100%;
    }

}


@media(max-width:600px){

    .weatherMain{

        flex-direction:
            column-reverse;

        align-items:flex-start;
    }


    .bigIcon{

        width:120px;
        height:120px;

        margin-bottom:10px;
    }


    .bigIcon i{
        font-size:70px;
    }


    .temperature{
        font-size:70px;
    }


    .stats{
        grid-template-columns:1fr;
    }


    .header{

        align-items:flex-start;

        gap:15px;

        flex-direction:column;
    }

}

</style>

</head>


<body>


<div class="container">


<!-- =========================
     LEFT SIDE
========================= -->

<div class="left">


<div class="header">


<div class="brand">

<div class="brandIcon">

<i class="fas fa-cloud-sun"></i>

</div>

<h2>
Smart Weather
</h2>

</div>


<div class="location" id="location">

<i class="fas fa-location-dot"></i>

<span>
Detecting location...
</span>

</div>


</div>


<!-- CURRENT WEATHER -->

<div class="current">


<div class="weatherMain">


<div class="weatherText">


<div
class="temperature"
id="temp"
>

--<span>°C</span>

</div>


<div
class="description"
id="desc"
>

Weather

</div>


<div
class="feels"
id="feels"
>

Feels like --

</div>


</div>


<div
class="bigIcon"
id="weatherIcon"
>

<i class="fas fa-cloud-sun"></i>

</div>


</div>



<!-- STATS -->

<div class="stats">


<div class="stat">

<div class="statIcon">

<i class="fas fa-wind"></i>

</div>


<div class="statInfo">

<span class="statLabel">
Wind Speed
</span>

<span
class="statValue"
id="wind"
>
--
</span>

</div>

</div>



<div class="stat">

<div class="statIcon">

<i class="fas fa-droplet"></i>

</div>


<div class="statInfo">

<span class="statLabel">
Humidity
</span>

<span
class="statValue"
id="humidity"
>
--
</span>

</div>

</div>



<div class="stat">

<div class="statIcon">

<i class="fas fa-cloud-rain"></i>

</div>


<div class="statInfo">

<span class="statLabel">
Rain Next 3h
</span>

<span
class="statValue"
id="rain"
>
--
</span>

</div>

</div>


</div>



<!-- LOCATION BUTTON -->

<div class="locationButton">

<button onclick="getLocation()">

<i
class="fas fa-location-crosshairs"
></i>

Use My Location

</button>

</div>


</div>



<!-- CHART -->

<div class="chartBox">


<div class="chartHeader">

<h3>
Temperature Trend
</h3>


<span>
5 Day Forecast
</span>

</div>


<div class="chart">

<canvas
id="tempChart"
></canvas>

</div>


</div>


</div>



<!-- =========================
     RIGHT SIDE
========================= -->

<div class="right">


<div class="forecastHeader">

<h3>
5 Day Forecast
</h3>


<span>
12 Hour Rain
</span>

</div>


<div id="forecast">

<div class="loading">

<div class="spinner"></div>

Loading forecast...

</div>

</div>


</div>


</div>



<script>


/* =========================
   API
========================= */

const apiKey =
"e9f87e5a4b1a26a53eb6a3fed7c5a704";


let chart;


/* =========================
   LOCATION
========================= */

function getLocation(){

    if(navigator.geolocation){

        navigator.geolocation.getCurrentPosition(
            showPosition,
            showLocationError
        );

    }

    else{

        document.getElementById(
            "location"
        ).innerHTML = `

        <i class="fas fa-location-dot"></i>

        <span>
            Location unavailable
        </span>

        `;

    }

}


/* =========================
   LOCATION ERROR
========================= */

function showLocationError(){

    document.getElementById(
        "location"
    ).innerHTML = `

    <i class="fas fa-location-dot"></i>

    <span>
        Location permission denied
    </span>

    `;

}


/* =========================
   POSITION
========================= */

function showPosition(position){

    const lat =
        position.coords.latitude;

    const lon =
        position.coords.longitude;


    getWeather(lat,lon);

    getForecast(lat,lon);

}


/* =========================
   WEATHER ICON
========================= */

function getWeatherIcon(condition){

    condition =
        condition.toLowerCase();


    if(condition.includes("clear")){
        return "fas fa-sun";
    }


    if(condition.includes("cloud")){
        return "fas fa-cloud";
    }


    if(condition.includes("rain")){
        return "fas fa-cloud-rain";
    }


    if(condition.includes("drizzle")){
        return "fas fa-cloud-rain";
    }


    if(condition.includes("thunder")){
        return "fas fa-cloud-bolt";
    }


    if(condition.includes("snow")){
        return "fas fa-snowflake";
    }


    if(
        condition.includes("mist") ||
        condition.includes("fog") ||
        condition.includes("haze")
    ){
        return "fas fa-smog";
    }


    return "fas fa-cloud-sun";

}


/* =========================
   CURRENT WEATHER
========================= */

function getWeather(lat,lon){

    const url =
    `https://api.openweathermap.org/data/2.5/weather?lat=${lat}&lon=${lon}&appid=${apiKey}&units=metric`;


    fetch(url)

    .then(res => res.json())

    .then(data => {


        document.getElementById(
            "location"
        ).innerHTML = `

        <i class="fas fa-location-dot"></i>

        <span>
            ${data.name}, ${data.sys.country}
        </span>

        `;


        document.getElementById(
            "temp"
        ).innerHTML = `

        ${Math.round(data.main.temp)}

        <span>
            °C
        </span>

        `;


        document.getElementById(
            "desc"
        ).innerText =
            data.weather[0].description;


        document.getElementById(
            "feels"
        ).innerText =

            `Feels like ${Math.round(
                data.main.feels_like
            )}°C`;


        document.getElementById(
            "wind"
        ).innerText =

            `${data.wind.speed} m/s`;


        document.getElementById(
            "humidity"
        ).innerText =

            `${data.main.humidity}%`;


        const icon =
            getWeatherIcon(
                data.weather[0].main
            );


        document.getElementById(
            "weatherIcon"
        ).innerHTML = `

        <i class="${icon}"></i>

        `;

    })


    .catch(error => {

        console.error(error);

        document.getElementById(
            "location"
        ).innerHTML = `

        <i class="fas fa-triangle-exclamation"></i>

        <span>
            Weather unavailable
        </span>

        `;

    });

}


/* =====================================================
   GET EXACT 12-HOUR RAINFALL
===================================================== */

function get12HourRainfall(data, startIndex){

    let totalRain = 0;

    let highestProbability = 0;


    /*
     * Each OpenWeather forecast item
     * represents 3 hours.
     *
     * Therefore:
     *
     * 4 forecast items
     * × 3 hours
     * = 12 hours
     */


    for(
        let j = startIndex;
        j < startIndex + 4;
        j++
    ){

        const item =
            data.list[j];


        if(!item){
            break;
        }


        /*
         * Rain for this 3-hour period
         */

        const rain =
            item.rain
            ? (item.rain["3h"] || 0)
            : 0;


        totalRain += rain;


        /*
         * Highest probability
         * within the 12-hour period
         */

        const probability =
            Math.round(
                (item.pop || 0) * 100
            );


        if(
            probability >
            highestProbability
        ){

            highestProbability =
                probability;

        }

    }


    return {

        rain:
            totalRain,

        probability:
            highestProbability

    };

}


/* =====================================================
   FORECAST
===================================================== */

function getForecast(lat,lon){

    const url =

    `https://api.openweathermap.org/data/2.5/forecast?lat=${lat}&lon=${lon}&appid=${apiKey}&units=metric`;


    fetch(url)

    .then(res => res.json())

    .then(data => {


        const forecast =
            document.getElementById(
                "forecast"
            );


        forecast.innerHTML = "";


        let temps = [];

        let labels = [];


        /* =================================================
           NEXT 12 HOURS
        ================================================= */


        /*
         * Find the first forecast entry
         * that is in the future.
         */

        const now =
            Date.now();


        let firstFutureIndex = 0;


        for(
            let i = 0;
            i < data.list.length;
            i++
        ){

            if(
                data.list[i].dt * 1000 >= now
            ){

                firstFutureIndex = i;

                break;

            }

        }


        /*
         * EXACTLY FOUR 3-HOUR PERIODS
         *
         * 4 × 3h = 12h
         */

        const next12 =
            get12HourRainfall(
                data,
                firstFutureIndex
            );


        document.getElementById(
            "rain"
        ).innerText =

            `${next12.rain.toFixed(1)} mm`;


        /* =================================================
           5 DAY FORECAST
        ================================================= */


        /*
         * Pick one forecast point
         * approximately every 24 hours.
         *
         * 8 entries × 3 hours = 24 hours
         */

        for(
            let i = 0;
            i < 5;
            i++
        ){


            const dayIndex =
                i * 8;


            const item =
                data.list[dayIndex];


            if(!item){
                continue;
            }


            const date =
                new Date(
                    item.dt * 1000
                );


            const day =
                date.toLocaleDateString(
                    "en-US",
                    {
                        weekday:"short"
                    }
                );


            const temp =
                Math.round(
                    item.main.temp
                );


            const icon =
                getWeatherIcon(
                    item.weather[0].main
                );


            /*
             * EXACTLY 12 HOURS
             *
             * Starting from this
             * day's representative
             * forecast point.
             */

            const twelveHour =
                get12HourRainfall(
                    data,
                    dayIndex
                );


            /* =================================================
               FORECAST CARD
            ================================================= */


            forecast.innerHTML += `

            <div class="day">


                <div class="dayTop">


                    <span class="dayName">

                        ${day}

                    </span>


                    <div class="dayWeather">


                        <i
                            class="${icon}"
                        ></i>


                        <span
                            class="dayTemp"
                        >

                            ${temp}°C

                        </span>


                    </div>


                </div>


                <div class="rainProb">


                    <i
                        class="fas fa-droplet"
                    ></i>


                    ${twelveHour.probability}% chance


                    <span>
                        •
                    </span>


                    ${twelveHour.rain.toFixed(1)} mm


                </div>


            </div>

            `;


            temps.push(temp);

            labels.push(day);

        }


        /* CHART */

        createChart(
            labels,
            temps
        );

    })


    .catch(error => {

        console.error(error);


        document.getElementById(
            "forecast"
        ).innerHTML = `

        <div class="loading">

            Unable to load forecast

        </div>

        `;

    });

}


/* =====================================================
   CHART
===================================================== */

function createChart(labels,temps){

    if(chart){

        chart.destroy();

    }


    chart =

    new Chart(

        document.getElementById(
            "tempChart"
        ),

        {

            type:"line",


            data:{

                labels:labels,


                datasets:[{

                    data:temps,

                    borderColor:
                        "#ff9800",

                    backgroundColor:
                        "rgba(255,152,0,.10)",

                    borderWidth:2,

                    pointBackgroundColor:
                        "#ffb74d",

                    pointBorderColor:
                        "#ffffff",

                    pointBorderWidth:2,

                    pointRadius:4,

                    tension:.4,

                    fill:true

                }]

            },


            options:{

                responsive:true,

                maintainAspectRatio:false,


                plugins:{

                    legend:{
                        display:false
                    }

                },


                scales:{

                    x:{

                        grid:{
                            display:false
                        },

                        border:{
                            display:false
                        },

                        ticks:{

                            color:
                                "rgba(255,255,255,.55)",

                            font:{
                                size:11
                            }

                        }

                    },


                    y:{

                        grid:{

                            color:
                                "rgba(255,255,255,.06)"

                        },

                        border:{
                            display:false
                        },

                        ticks:{

                            color:
                                "rgba(255,255,255,.45)",

                            font:{
                                size:10
                            },

                            callback:function(value){

                                return value + "°";

                            }

                        }

                    }

                }

            }

        }

    );

}


/* =====================================================
   START
===================================================== */

getLocation();

</script>

</body>

</html>
