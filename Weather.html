<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Smart Weather Dashboard</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{
height:100vh;
background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
display:flex;
justify-content:center;
align-items:center;
color:white;
}

.container{
width:1150px;
height:620px;
background:rgba(0,0,0,0.55);
backdrop-filter:blur(15px);
border-radius:25px;
padding:40px;
display:flex;
justify-content:space-between;
box-shadow:0 20px 60px rgba(0,0,0,0.6);
}

/* LEFT PANEL */

.left{
width:70%;
display:flex;
flex-direction:column;
justify-content:space-between;
}

.location{
font-size:15px;
opacity:.7;
}

.temp{
font-size:90px;
font-weight:200;
}

.desc{
font-size:26px;
opacity:.9;
margin-bottom:10px;
text-transform:capitalize;
}

.weatherIcon{
font-size:120px;
color:#ffd54f;
margin:10px 0;
}

.stats{
display:flex;
gap:50px;
margin-top:10px;
}

.stat{
display:flex;
align-items:center;
gap:10px;
font-size:16px;
opacity:.9;
}

.stat i{
color:#ffcc80;
}

.chart{
width:100%;
height:150px;
margin-top:20px;
}

button{
padding:12px 22px;
border:none;
border-radius:10px;
background:linear-gradient(135deg,#ff9800,#ffb74d);
color:white;
font-size:15px;
cursor:pointer;
margin-top:10px;
transition:.3s;
}

button:hover{
transform:scale(1.05);
}

/* RIGHT PANEL */

.right{
width:260px;
background:rgba(255,255,255,0.08);
border-radius:20px;
padding:20px;
}

.right h3{
margin-bottom:15px;
}

.day{
padding:12px 0;
border-bottom:1px solid rgba(255,255,255,0.08);
}

.day:last-child{
border:none;
}

.dayTop{
display:flex;
justify-content:space-between;
font-size:15px;
}

.rainProb{
font-size:12px;
opacity:.7;
color:#90caf9;
margin-top:3px;
}

</style>
</head>

<body>

<div class="container">

<!-- LEFT SIDE -->

<div class="left">

<div>

<div class="location" id="location">Detecting location...</div>

<div class="weatherIcon">
<i class="fas fa-cloud-sun"></i>
</div>

<div class="temp" id="temp">--°</div>

<div class="desc" id="desc">Weather</div>

<div class="stats">

<div class="stat">
<i class="fas fa-wind"></i>
<span id="wind">--</span>
</div>

<div class="stat">
<i class="fas fa-droplet"></i>
<span id="humidity">--</span>
</div>

<div class="stat">
<i class="fas fa-cloud-rain"></i>
<span id="rain">--</span>
</div>

</div>

<button onclick="getLocation()">📍 Use My Location</button>

</div>

<div class="chart">
<canvas id="tempChart"></canvas>
</div>

</div>


<!-- RIGHT FORECAST -->

<div class="right">

<h3>5 Day Forecast</h3>

<div id="forecast"></div>

</div>

</div>

<script>

const apiKey = "e9f87e5a4b1a26a53eb6a3fed7c5a704";

let chart;

/* LOCATION */

function getLocation(){
if(navigator.geolocation){
navigator.geolocation.getCurrentPosition(showPosition);
}
}

/* POSITION */

function showPosition(position){

let lat = position.coords.latitude;
let lon = position.coords.longitude;

getWeather(lat,lon);
getForecast(lat,lon);

}

/* CURRENT WEATHER */

function getWeather(lat,lon){

let url=`https://api.openweathermap.org/data/2.5/weather?lat=${lat}&lon=${lon}&appid=${apiKey}&units=metric`;

fetch(url)
.then(res=>res.json())
.then(data=>{

document.getElementById("location").innerText =
data.name+", "+data.sys.country;

document.getElementById("temp").innerText =
Math.round(data.main.temp)+"°C";

document.getElementById("desc").innerText =
data.weather[0].description;

document.getElementById("wind").innerText =
data.wind.speed+" m/s";

document.getElementById("humidity").innerText =
data.main.humidity+"%";

if(data.rain){
document.getElementById("rain").innerText=data.rain["1h"]+" mm";
}else{
document.getElementById("rain").innerText="0 mm";
}

});

}

/* FORECAST */

function getForecast(lat,lon){

let url=`https://api.openweathermap.org/data/2.5/forecast?lat=${lat}&lon=${lon}&appid=${apiKey}&units=metric`;

fetch(url)
.then(res=>res.json())
.then(data=>{

let forecast=document.getElementById("forecast");
forecast.innerHTML="";

let temps=[];
let labels=[];

for(let i=0;i<5;i++){

let item=data.list[i*8];

let date=new Date(item.dt_txt);

let day=date.toDateString().slice(0,3);

let temp=Math.round(item.main.temp);

let rainProb=Math.round(item.pop*100);

let rainMM=item.rain ? item.rain["3h"] : 0;

forecast.innerHTML+=`

<div class="day">

<div class="dayTop">

<span>${day}</span>

<span><i class="fas fa-cloud"></i> ${temp}°</span>

</div>

<div class="rainProb">

🌧 ${rainProb}% chance • ${rainMM} mm

</div>

</div>

`;

temps.push(temp);
labels.push(day);

}

createChart(labels,temps);

});

}

/* CHART */

function createChart(labels,temps){

if(chart) chart.destroy();

chart=new Chart(document.getElementById("tempChart"),{

type:'line',

data:{
labels:labels,
datasets:[{
data:temps,
borderColor:"#ff9800",
backgroundColor:"rgba(255,152,0,0.2)",
tension:.4,
fill:true
}]
},

options:{
plugins:{legend:{display:false}},
scales:{
x:{ticks:{color:"white"}},
y:{ticks:{color:"white"}}
}
}

});

}

</script>

</body>
</html>
