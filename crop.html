<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Crop Recommendation | SmartCrop</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

/* Background */

body{
height:100vh;
background:url('https://images.unsplash.com/photo-1500382017468-9049fed747ef') center/cover no-repeat;
display:flex;
align-items:center;
justify-content:center;
color:white;
}

/* Dark overlay */

body::before{
content:"";
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.5);
z-index:0;
}

/* Main container */

.container{
position:relative;
z-index:1;
display:flex;
gap:40px;
background:rgba(255,255,255,0.05);
backdrop-filter:blur(20px);
padding:40px;
border-radius:20px;
width:900px;
}

/* Left side text */

.info{
flex:1;
}

.info h1{
font-size:36px;
margin-bottom:15px;
}

.info p{
opacity:0.8;
line-height:1.6;
}

/* Form card */

.card{
flex:1;
background:rgba(255,255,255,0.08);
padding:30px;
border-radius:15px;
}

/* Inputs */

select,input{
width:100%;
padding:12px;
margin-top:12px;
border:none;
border-radius:8px;
outline:none;
}

button{
margin-top:20px;
width:100%;
padding:14px;
border:none;
border-radius:10px;
background:#f4b400;
color:black;
font-weight:600;
cursor:pointer;
}

button:hover{
background:#ffcc00;
}

/* Result */

#result{
margin-top:20px;
font-size:18px;
font-weight:500;
}

</style>

</head>

<body>

<div class="container">

<div class="info">

<h1>AI Crop Recommendation</h1>

<p>
SmartCrop analyzes soil, weather and seasonal conditions to suggest
the most suitable crop for maximum yield and profit.
</p>

</div>


<div class="card">

<select id="soil">
<option value="">Select Soil Type</option>
<option value="loamy">Loamy</option>
<option value="sandy">Sandy</option>
<option value="clay">Clay</option>
<option value="black">Black</option>
</select>

<input type="number" id="temp" placeholder="Temperature (°C)">

<input type="number" id="rain" placeholder="Rainfall (mm)">

<select id="season">
<option value="">Select Season</option>
<option value="summer">Summer</option>
<option value="winter">Winter</option>
<option value="monsoon">Monsoon</option>
</select>

<button onclick="recommendCrop()">Get Recommendation</button>

<div id="result"></div>

</div>

</div>
<script>

async function recommendCrop(){

let soil = document.getElementById("soil").value
let temp = document.getElementById("temp").value
let rain = document.getElementById("rain").value
let season = document.getElementById("season").value

if(temp=="" || rain==""){
document.getElementById("result").innerHTML="Please enter temperature and rainfall"
return
}

let response = await fetch("http://127.0.0.1:5000/predict",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({
soil:soil,
temperature:temp,
rainfall:rain,
season:season
})

})

let result = await response.json()

document.getElementById("result").innerHTML =
"🌾 Recommended Crop: <b>"+result.crop+"</b>"

}

</script>
<script src="crop.js"></script>

</body>

</html>
